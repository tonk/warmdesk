name: Build server (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    name: Build server tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Go tests
        run: cd backend && go test ./...

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm test

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install doc build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
          sudo gem install asciidoctor-pdf

      - name: Build guide PDFs
        run: make docs-pdf-guides

      - name: Embed frontend into binary
        run: |
          mkdir -p backend/staticweb/files
          cp -r frontend/dist/. backend/staticweb/files/
          mkdir -p backend/staticweb/files/docs
          cp docs/user-guide.pdf docs/admin-guide.pdf backend/staticweb/files/docs/

      - name: Build backend (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist-amd64
          cd backend
          go build -tags embed -ldflags="-s -w -X main.version=dev-${SHA}" -o ../dist-amd64/warmdesk .
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-seed ./cmd/seed
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-export ./cmd/export
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-import ./cmd/importer
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-training ./cmd/training
          go build -ldflags="-s -w -X main.version=dev-${SHA}" -o ../dist-amd64/warmdesk-timer ./cmd/timer

      - name: Build backend (linux/arm64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist-arm64
          cd backend
          go build -tags embed -ldflags="-s -w -X main.version=dev-${SHA}" -o ../dist-arm64/warmdesk .
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-seed ./cmd/seed
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-export ./cmd/export
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-import ./cmd/importer
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-training ./cmd/training
          go build -ldflags="-s -w -X main.version=dev-${SHA}" -o ../dist-arm64/warmdesk-timer ./cmd/timer

      - name: Assemble distributions
        run: |
          for ARCH in amd64 arm64; do
            mkdir -p dist-${ARCH}
            cp warmdesk.yaml.example dist-${ARCH}/warmdesk.yaml.example
            cp warmdesk-migrate.yaml.example dist-${ARCH}/warmdesk-migrate.yaml.example
            cp -r deploy dist-${ARCH}/deploy
            cp INSTALL.md dist-${ARCH}/INSTALL.md
            cp README.md dist-${ARCH}/README.md
            cp -r docs dist-${ARCH}/docs
          done

      - name: Create archives
        run: |
          SHA=$(git rev-parse --short HEAD)
          tar -czf "warmdesk-dev-${SHA}-linux-amd64.tar.gz" -C dist-amd64 .
          tar -czf "warmdesk-dev-${SHA}-linux-arm64.tar.gz" -C dist-arm64 .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WarmDesk-server
          path: warmdesk-dev-*-linux-*.tar.gz
