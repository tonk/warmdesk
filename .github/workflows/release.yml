name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.10.17)'
        required: true

permissions:
  contents: write
  id-token: write   # required by SignPath to verify OIDC build identity
  actions: read     # required by SignPath to read workflow artifact metadata

# Resolve the release tag regardless of trigger:
#   - tag push  → github.ref_name is the tag (e.g. v0.10.17)
#   - manual    → use the `tag` input
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ── Create draft release first ───────────────────────────────────────────────
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "WarmDesk $RELEASE_TAG" \
            || true  # ignore if release already exists

  # ── Server binary + web frontend tarball ────────────────────────────────────
  release-server:
    name: Build server binary
    runs-on: ubuntu-latest
    needs: create-release
    env:
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Go tests
        run: cd backend && go test ./...

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm test

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install doc build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
          sudo gem install asciidoctor-pdf

      - name: Build guide PDFs
        run: make docs-pdf-guides

      - name: Embed frontend into binary
        run: |
          mkdir -p backend/staticweb/files
          cp -r frontend/dist/. backend/staticweb/files/
          mkdir -p backend/staticweb/files/docs
          cp docs/user-guide.pdf docs/admin-guide.pdf backend/staticweb/files/docs/

      - name: Build backend (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist-amd64
          cd backend
          go build -tags embed -ldflags="-s -w -X main.version=${{ env.RELEASE_TAG }}" -o ../dist-amd64/warmdesk .
          go build -ldflags="-s -w -X main.version=${{ env.RELEASE_TAG }}" -o ../dist-amd64/warmdesk-seed ./cmd/seed
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-export ./cmd/export
          go build -ldflags="-s -w" -o ../dist-amd64/warmdesk-import ./cmd/importer
          go build -ldflags="-s -w -X main.version=${{ env.RELEASE_TAG }}" -o ../dist-amd64/warmdesk-training ./cmd/training
          go build -ldflags="-s -w -X main.version=${{ env.RELEASE_TAG }}" -o ../dist-amd64/warmdesk-timer ./cmd/timer

      - name: Build backend (linux/arm64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p dist-arm64
          cd backend
          go build -tags embed -ldflags="-s -w -X main.version=${{ env.RELEASE_TAG }}" -o ../dist-arm64/warmdesk .
          go build -ldflags="-s -w -X main.version=${{ env.RELEASE_TAG }}" -o ../dist-arm64/warmdesk-seed ./cmd/seed
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-export ./cmd/export
          go build -ldflags="-s -w" -o ../dist-arm64/warmdesk-import ./cmd/importer
          go build -ldflags="-s -w -X main.version=${{ env.RELEASE_TAG }}" -o ../dist-arm64/warmdesk-training ./cmd/training
          go build -ldflags="-s -w -X main.version=${{ env.RELEASE_TAG }}" -o ../dist-arm64/warmdesk-timer ./cmd/timer

      - name: Build warmdesk-timer for workstations
        env:
          CGO_ENABLED: 0
        run: |
          # The timer CLI runs on the user's own machine, so besides being in
          # the server tarballs it is published standalone for every desktop OS.
          cd backend
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -ldflags="-s -w -X main.version=${{ env.RELEASE_TAG }}" \
              -o ../warmdesk-timer-${{ env.RELEASE_TAG }}-${os}-${arch}${ext} ./cmd/timer
          done

      - name: Assemble distributions
        run: |
          for ARCH in amd64 arm64; do
            mkdir -p dist-${ARCH}
            cp warmdesk.yaml.example dist-${ARCH}/warmdesk.yaml.example
            cp warmdesk-migrate.yaml.example dist-${ARCH}/warmdesk-migrate.yaml.example
            cp -r deploy dist-${ARCH}/deploy
            cp INSTALL.md dist-${ARCH}/INSTALL.md
            cp README.md dist-${ARCH}/README.md
            cp -r docs dist-${ARCH}/docs
          done

      - name: Create archives
        run: |
          tar -czf warmdesk-${{ env.RELEASE_TAG }}-linux-amd64.tar.gz -C dist-amd64 .
          tar -czf warmdesk-${{ env.RELEASE_TAG }}-linux-arm64.tar.gz -C dist-arm64 .

      - name: Sign archives
        if: env.HAS_GPG == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          for f in warmdesk-${{ env.RELEASE_TAG }}-linux-amd64.tar.gz \
                   warmdesk-${{ env.RELEASE_TAG }}-linux-arm64.tar.gz \
                   warmdesk-timer-${{ env.RELEASE_TAG }}-*; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor --local-user "$GPG_KEY_ID" "$f"
          done

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            warmdesk-${{ env.RELEASE_TAG }}-linux-amd64.tar.gz \
            warmdesk-${{ env.RELEASE_TAG }}-linux-arm64.tar.gz \
            $(ls warmdesk-${{ env.RELEASE_TAG }}-linux-amd64.tar.gz.asc 2>/dev/null || true) \
            $(ls warmdesk-${{ env.RELEASE_TAG }}-linux-arm64.tar.gz.asc 2>/dev/null || true) \
            warmdesk-timer-${{ env.RELEASE_TAG }}-*

  # ── Tauri desktop clients ────────────────────────────────────────────────────
  release-desktop:
    name: Build desktop client (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    env:
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundle: appimage

          - name: macOS
            os: macos-14
            bundle: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            clang \
            mold \
            rpm

      - name: Set up Go
        # scripts/build-timer.mjs builds warmdesk-timer into the .deb/.rpm
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-14'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm test

      - name: Stamp version in tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const raw = process.env.VERSION.replace(/^v/, '');
            const ver = raw.split('.').slice(0, 3).join('.');
            const tp = 'frontend/src-tauri/tauri.conf.json';
            const tc = JSON.parse(fs.readFileSync(tp, 'utf8'));
            tc.version = ver;
            fs.writeFileSync(tp, JSON.stringify(tc, null, 2) + '\n');
            const cp = 'frontend/src-tauri/Cargo.toml';
            let cargo = fs.readFileSync(cp, 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]*\"/m, 'version = \"' + ver + '\"');
            fs.writeFileSync(cp, cargo);
          "
        env:
          VERSION: ${{ env.RELEASE_TAG }}

      - name: Build desktop app (Linux)
        if: matrix.os == 'ubuntu-24.04'
        # NO_STRIP=true: linuxdeploy's bundled strip is too old for newer glibc.
        # The Rust release profile already strips the binary.
        # RUSTC_WRAPPER="": override .cargo/config.toml's sccache wrapper — not installed on CI runners.
        env:
          RUSTC_WRAPPER: ""
        run: cd frontend && NO_STRIP=true npm run tauri:build -- --bundles appimage,deb,rpm

      - name: Build desktop app (macOS universal)
        if: matrix.os == 'macos-14'
        # Build a universal binary covering both Intel and Apple Silicon.
        # RUSTC_WRAPPER="": override .cargo/config.toml's sccache wrapper — not installed on CI runners.
        env:
          RUSTC_WRAPPER: ""
        run: cd frontend && npm run tauri:build -- --bundles dmg --target universal-apple-darwin

      - name: Collect and rename artifact (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          SRC=$(ls frontend/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          cp "$SRC" "WarmDesk-${{ env.RELEASE_TAG }}-x86_64.AppImage"
          SRC=$(ls frontend/src-tauri/target/release/bundle/deb/*.deb | head -1)
          cp "$SRC" "WarmDesk-${{ env.RELEASE_TAG }}-amd64.deb"
          SRC=$(ls frontend/src-tauri/target/release/bundle/rpm/*.rpm | head -1)
          cp "$SRC" "WarmDesk-${{ env.RELEASE_TAG }}-x86_64.rpm"

      - name: Collect and rename artifact (macOS)
        if: matrix.os == 'macos-14'
        run: |
          SRC=$(ls frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$SRC" "WarmDesk-${{ env.RELEASE_TAG }}-universal.dmg"

      - name: Sign artifacts (Linux)
        if: matrix.os == 'ubuntu-24.04' && env.HAS_GPG == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          for f in WarmDesk-${{ env.RELEASE_TAG }}-x86_64.AppImage \
                   WarmDesk-${{ env.RELEASE_TAG }}-amd64.deb \
                   WarmDesk-${{ env.RELEASE_TAG }}-x86_64.rpm; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor --local-user "$GPG_KEY_ID" "$f"
          done

      - name: Sign artifact (macOS)
        if: matrix.os == 'macos-14' && env.HAS_GPG == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor --local-user "$GPG_KEY_ID" \
            WarmDesk-${{ env.RELEASE_TAG }}-universal.dmg

      - name: Upload to GitHub Release (Linux)
        if: matrix.os == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            WarmDesk-${{ env.RELEASE_TAG }}-x86_64.AppImage \
            WarmDesk-${{ env.RELEASE_TAG }}-amd64.deb \
            WarmDesk-${{ env.RELEASE_TAG }}-x86_64.rpm \
            $(ls WarmDesk-${{ env.RELEASE_TAG }}-x86_64.AppImage.asc 2>/dev/null || true) \
            $(ls WarmDesk-${{ env.RELEASE_TAG }}-amd64.deb.asc 2>/dev/null || true) \
            $(ls WarmDesk-${{ env.RELEASE_TAG }}-x86_64.rpm.asc 2>/dev/null || true)

      - name: Upload to GitHub Release (macOS)
        if: matrix.os == 'macos-14'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            WarmDesk-${{ env.RELEASE_TAG }}-universal.dmg \
            $(ls WarmDesk-${{ env.RELEASE_TAG }}-universal.dmg.asc 2>/dev/null || true)

  # ── Windows desktop client (separate job for SignPath code signing) ───────────
  release-desktop-windows:
    name: Build and sign desktop client (Windows)
    runs-on: windows-latest
    needs: create-release
    env:
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm test

      - name: Stamp version in tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const raw = process.env.VERSION.replace(/^v/, '');
            const ver = raw.split('.').slice(0, 3).join('.');
            const tp = 'frontend/src-tauri/tauri.conf.json';
            const tc = JSON.parse(fs.readFileSync(tp, 'utf8'));
            tc.version = ver;
            fs.writeFileSync(tp, JSON.stringify(tc, null, 2) + '\n');
            const cp = 'frontend/src-tauri/Cargo.toml';
            let cargo = fs.readFileSync(cp, 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]*\"/m, 'version = \"' + ver + '\"');
            fs.writeFileSync(cp, cargo);
          "
        env:
          VERSION: ${{ env.RELEASE_TAG }}

      - name: Build desktop app (Windows)
        # RUSTC_WRAPPER="": override .cargo/config.toml's sccache wrapper — not installed on CI runners.
        env:
          RUSTC_WRAPPER: ""
        run: cd frontend && npm run tauri:build -- --bundles nsis

      - name: Collect unsigned artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName "WarmDesk-${{ env.RELEASE_TAG }}-x64-setup.exe"
          Compress-Archive -Path "frontend/src-tauri/target/release/WarmDesk.exe" -DestinationPath "WarmDesk-${{ env.RELEASE_TAG }}-x64-portable.zip"

      - name: Sign artifacts (Windows)
        if: env.HAS_GPG == 'true'
        shell: bash
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          for f in "WarmDesk-${{ env.RELEASE_TAG }}-x64-setup.exe" \
                   "WarmDesk-${{ env.RELEASE_TAG }}-x64-portable.zip"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor --local-user "$GPG_KEY_ID" "$f"
          done

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" `
            --repo "${{ github.repository }}" `
            --clobber `
            "WarmDesk-${{ env.RELEASE_TAG }}-x64-setup.exe" `
            "WarmDesk-${{ env.RELEASE_TAG }}-x64-portable.zip"
        shell: pwsh

  # ── Publish release after all assets are uploaded ───────────────────────────
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [release-server, release-desktop, release-desktop-windows]

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
