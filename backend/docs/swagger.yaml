  /projects/{projectSlug}/cards/{cardId}/transfer:
    post:
      consumes:
      - application/json
      description: |-
        action "copy" creates a new card with the title, description, priority, due date and tags.
        action "move" keeps the card itself (comments, checklist, attachments, history, links, time spent)
        and gives it the next number in the target project; its old key (e.g. PRJ-12) keeps resolving.
        Labels are matched by name (missing ones are created), epic and sprints are cleared, and
        assignees/watchers without access to the target project are removed.
        sub_cards: "move" (default) moves sub-cards along, "detach" leaves them in the source project.
        Requires member access to both projects; a project-scoped API key must be scoped to the target.
      parameters:
      - description: Source project slug
        in: path
        name: projectSlug
        required: true
        type: string
      - description: Card ID
        in: path
        name: cardId
        required: true
        type: integer
      - description: target_project_slug, column_id, action (copy|move), optional
          sub_cards (move|detach)
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.transferCardResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Copy or move a card to a column in another project
      tags:
      - cards
