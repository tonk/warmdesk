basePath: /api/v1
definitions:
  handlers.loginRequest:
    properties:
      login:
        description: email or username
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  handlers.registerRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
