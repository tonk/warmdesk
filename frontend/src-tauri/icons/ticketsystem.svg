<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="160"
   height="156.5"
   viewBox="0 0 160 156.5"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .desk-top   { fill: #9FE1CB; }
      .desk-body  { fill: #5DCAA5; }
      .desk-leg   { fill: #1D9E75; }
      .ticket-rim  { fill: #0F6E56; }
      .ticket-face { fill: #1D9E75; }
      .ticket-line { stroke: #9FE1CB; fill: none; }
      .ticket-mark { fill: #9FE1CB; }
      .ticket-check { stroke: #9FE1CB; }
    </style>
  </defs>

  <!-- Desk legs -->
  <rect class="desk-leg" x="24"  y="104.5" width="11" height="52" rx="3"/>
  <rect class="desk-leg" x="125" y="104.5" width="11" height="52" rx="3"/>

  <!-- Desk apron -->
  <rect class="desk-body" x="10" y="88.5" width="140" height="20" rx="5"/>

  <!-- Desk top surface -->
  <rect class="desk-top" x="0" y="76.5" width="160" height="16" rx="4"/>

  <!-- Ticket (drawn after desk so it rests on the surface) -->
  <g transform="rotate(-8 80 50)">
    <path class="ticket-rim" d="M52,28 H108 a4,4 0 0 1 4,4 V44 a6,6 0 0 0 0,12 V68 a4,4 0 0 1 -4,4 H52 a4,4 0 0 1 -4,-4 V56 a6,6 0 0 0 0,-12 V32 a4,4 0 0 1 4,-4 Z"/>
    <path class="ticket-face" d="M54,31 H106 a2,2 0 0 1 2,2 V45.5 a8,8 0 0 0 0,9 V67 a2,2 0 0 1 -2,2 H54 a2,2 0 0 1 -2,-2 V54.5 a8,8 0 0 0 0,-9 V33 a2,2 0 0 1 2,-2 Z"/>
    <line class="ticket-line" x1="92" y1="33" x2="92" y2="67" stroke-width="2" stroke-dasharray="3 3"/>
    <rect class="ticket-mark" x="58" y="37" width="26" height="4" rx="2"/>
    <rect class="ticket-mark" x="58" y="46" width="20" height="4" rx="2"/>
    <rect class="ticket-mark" x="58" y="55" width="23" height="4" rx="2"/>
    <path class="ticket-check" d="M96,50 l4,4 l7,-8" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
