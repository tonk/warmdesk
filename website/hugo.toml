baseURL = "https://tonk.github.io/warmdesk/"
languageCode = "en-us"
title = "WarmDesk"
theme = "warmdesk"
enableRobotsTXT = true
enableEmoji = true

[params]
  description = "Self-hosted project management for modern teams"
  author = "Ton Kersten"
  github = "https://github.com/tonk/warmdesk"
  email = "tonk@smartowl.nl"
  tagline = "Own Your Workflow"
  subtitle = "A single Go binary covering Kanban boards, Scrum sprints, team chat with one-to-one voice & video calls, helpdesk ticketing with SLA, customer management, time tracking, and Git integration — owned and operated by you."
  # Social preview image (absolute URL built via absURL). Prefer ≥1200×630 PNG/JPEG for best crawler support.
  og_image = "images/logo-full.svg"
  # Release info — update both this and warmdesk-version in [markup.asciidocext.attributes] on each release
  warmdesk_version = "v0.34.0"
  release_date     = "2026-09-25"
  # Blog post slug for the current release (linked from the homepage "What's new" strip)
  release_blog     = "blog/release-0.34.0/"
  # Release highlights shown in the "What's new" strip on the homepage (2-3 bullets)
  release_highlights = [
    "**Added — Timer button in the top bar** — start and stop time tracking from any page, in the browser and the desktop apps; it's the same timer as `warmdesk-timer`, and every open window follows along live.",
    "**Added — Defaults for `warmdesk-timer`** — a default project and customer in `timer.yaml` make a plain `warmdesk-timer start` enough; `timer.yaml.example` documents the file.",
  ]

[markup]
  [markup.asciidocext]
    backend = "html5"
    extensions = []
    failureLevel = "fatal"
    noHeaderOrFooter = true
    preserveTOC = false
    safeMode = "unsafe"
    sectionNumbers = false
    trace = false
    verbose = false
    workingFolderCurrent = false
    [markup.asciidocext.attributes]
      "source-highlighter" = "highlight.js"
      "sectanchors" = ""
      "sectlinks" = ""
      "warmdesk-version" = "v0.34.0"

  # Chroma off — fenced Markdown code stays plain <pre><code>; AsciiDoc uses hljs (see theme head).
  [markup.highlight]
    codeFences = false

[security]
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^npx$', '^postcss$', '^tailwindcss$', '^asciidoctor$']

[[menus.main]]
  name = "Features"
  url = "/#features"
  weight = 10

[[menus.main]]
  name = "Screenshots"
  url = "/#screenshots"
  weight = 20

[[menus.main]]
  name = "Docs"
  url = "/docs/"
  weight = 30

[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 40

[[menus.main]]
  name = "Download"
  url = "/download/"
  weight = 45

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/tonk/warmdesk"
  weight = 50
  [menus.main.params]
    external = true
    icon = "github"
