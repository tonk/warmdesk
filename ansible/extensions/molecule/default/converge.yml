---
# Full lifecycle test for key WarmDesk Ansible modules.
# Each resource goes through: create → idempotency → update → update-idempotency → absent → absent-idempotency.
# Assertions use `ansible.builtin.assert` immediately after each operation.

- name: Converge
  hosts: all
  gather_facts: false
  connection: local

  vars_files:
    - /tmp/warmdesk-molecule/credentials.yml

  tasks:

    # =========================================================================
    # Pre-flight teardown — ensure test resources don't exist from a prior
    # interrupted run so each converge starts from a clean state.
    # =========================================================================

    - name: "[preflight] Remove customer if left over from a failed run"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Test Customer"
        state: absent

    - name: "[preflight] Remove invoice_template if left over"
      ansilabnl.warmdesk.invoice_template:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Monthly Support"
        state: absent

    - name: "[preflight] Purge test user if left over (hard-delete so username/email can be reused)"
      ansilabnl.warmdesk.user:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        username: "mol-testuser"
        state: purge

    # =========================================================================
    # customer module
    # =========================================================================

    - name: "[customer] Create customer"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Test Customer"
        description: "Created by Molecule tests"
        state: present
      register: cust_create

    - name: "[customer] Assert create reported changed and returned the resource"
      ansible.builtin.assert:
        that:
          - cust_create.changed
          - cust_create.customer is not none
          - cust_create.customer.name == "Molecule Test Customer"
          - cust_create.customer.id is defined
        fail_msg: "customer create failed: {{ cust_create }}"

    - name: "[customer] Create same customer again (idempotency)"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Test Customer"
        description: "Created by Molecule tests"
        state: present
      register: cust_idempotent

    - name: "[customer] Assert no change on idempotent re-run"
      ansible.builtin.assert:
        that:
          - not cust_idempotent.changed
        fail_msg: "customer idempotency failed: module reported changed on second run"

    - name: "[customer] Update customer description"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Test Customer"
        description: "Updated by Molecule"
        state: present
      register: cust_update

    - name: "[customer] Assert update reported changed"
      ansible.builtin.assert:
        that:
          - cust_update.changed
        fail_msg: "customer update failed: module did not report changed"

    - name: "[customer] Update same description again (idempotency)"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Test Customer"
        description: "Updated by Molecule"
        state: present
      register: cust_update_idempotent

    - name: "[customer] Assert no change on update idempotency"
      ansible.builtin.assert:
        that:
          - not cust_update_idempotent.changed
        fail_msg: "customer update idempotency failed"

    - name: "[customer] Star the customer"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Test Customer"
        starred: true
        state: present
      register: cust_star

    - name: "[customer] Assert starring reported changed"
      ansible.builtin.assert:
        that:
          - cust_star.changed
        fail_msg: "customer star failed"

    - name: "[customer] Star again (idempotency)"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Test Customer"
        starred: true
        state: present
      register: cust_star_idempotent

    - name: "[customer] Assert no change when already starred"
      ansible.builtin.assert:
        that:
          - not cust_star_idempotent.changed
        fail_msg: "customer star idempotency failed"

    # =========================================================================
    # customer_contact module  (depends on customer existing above)
    # =========================================================================

    - name: "[customer_contact] Create contact under customer"
      ansilabnl.warmdesk.customer_contact:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        customer: "Molecule Test Customer"
        name: "Alice Bakker"
        department: "Procurement"
        email: "alice@example.com"
        phone: "+31 20 123 4567"
        is_primary: true
        state: present
      register: contact_create

    - name: "[customer_contact] Assert contact created"
      ansible.builtin.assert:
        that:
          - contact_create.changed
          - contact_create.contact is not none
          - contact_create.contact.name == "Alice Bakker"
          - contact_create.contact.email == "alice@example.com"
        fail_msg: "customer_contact create failed: {{ contact_create }}"

    - name: "[customer_contact] Create same contact again (idempotency)"
      ansilabnl.warmdesk.customer_contact:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        customer: "Molecule Test Customer"
        name: "Alice Bakker"
        department: "Procurement"
        email: "alice@example.com"
        phone: "+31 20 123 4567"
        is_primary: true
        state: present
      register: contact_idempotent

    - name: "[customer_contact] Assert no change on idempotent re-run"
      ansible.builtin.assert:
        that:
          - not contact_idempotent.changed
        fail_msg: "customer_contact idempotency failed"

    - name: "[customer_contact] Update contact email"
      ansilabnl.warmdesk.customer_contact:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        customer: "Molecule Test Customer"
        name: "Alice Bakker"
        email: "alice.bakker@example.com"
        state: present
      register: contact_update

    - name: "[customer_contact] Assert update reported changed"
      ansible.builtin.assert:
        that:
          - contact_update.changed
        fail_msg: "customer_contact update failed"

    - name: "[customer_contact] Remove contact"
      ansilabnl.warmdesk.customer_contact:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        customer: "Molecule Test Customer"
        name: "Alice Bakker"
        state: absent
      register: contact_absent

    - name: "[customer_contact] Assert removal reported changed"
      ansible.builtin.assert:
        that:
          - contact_absent.changed
        fail_msg: "customer_contact absent failed"

    - name: "[customer_contact] Remove absent contact again (idempotency)"
      ansilabnl.warmdesk.customer_contact:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        customer: "Molecule Test Customer"
        name: "Alice Bakker"
        state: absent
      register: contact_absent_idempotent

    - name: "[customer_contact] Assert no change when already absent"
      ansible.builtin.assert:
        that:
          - not contact_absent_idempotent.changed
        fail_msg: "customer_contact absent idempotency failed"

    # =========================================================================
    # Delete customer (must happen after contact tests)
    # =========================================================================

    - name: "[customer] Remove customer"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Test Customer"
        state: absent
      register: cust_absent

    - name: "[customer] Assert removal reported changed"
      ansible.builtin.assert:
        that:
          - cust_absent.changed
        fail_msg: "customer absent failed"

    - name: "[customer] Remove absent customer again (idempotency)"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Test Customer"
        state: absent
      register: cust_absent_idempotent

    - name: "[customer] Assert no change when already absent"
      ansible.builtin.assert:
        that:
          - not cust_absent_idempotent.changed
        fail_msg: "customer absent idempotency failed"

    # =========================================================================
    # invoice_template module
    # =========================================================================

    - name: "[invoice_template] Create template"
      ansilabnl.warmdesk.invoice_template:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Monthly Support"
        line_items:
          - description: "Monthly support retainer"
            quantity: 1.0
            unit_price: 500.0
            currency: "EUR"
        default_vat_rate: 21.0
        default_currency: "EUR"
        notes: "8 hours included"
        state: present
      register: tmpl_create

    - name: "[invoice_template] Assert template created"
      ansible.builtin.assert:
        that:
          - tmpl_create.changed
          - tmpl_create.invoice_template is not none
          - tmpl_create.invoice_template.name == "Monthly Support"
        fail_msg: "invoice_template create failed: {{ tmpl_create }}"

    - name: "[invoice_template] Create same template again (idempotency)"
      ansilabnl.warmdesk.invoice_template:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Monthly Support"
        line_items:
          - description: "Monthly support retainer"
            quantity: 1.0
            unit_price: 500.0
            currency: "EUR"
        default_vat_rate: 21.0
        default_currency: "EUR"
        notes: "8 hours included"
        state: present
      register: tmpl_idempotent

    - name: "[invoice_template] Assert no change on idempotent re-run"
      ansible.builtin.assert:
        that:
          - not tmpl_idempotent.changed
        fail_msg: "invoice_template idempotency failed"

    - name: "[invoice_template] Update template notes"
      ansilabnl.warmdesk.invoice_template:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Monthly Support"
        notes: "8 hours included — updated"
        state: present
      register: tmpl_update

    - name: "[invoice_template] Assert update reported changed"
      ansible.builtin.assert:
        that:
          - tmpl_update.changed
        fail_msg: "invoice_template update failed"

    - name: "[invoice_template] Update same notes again (idempotency)"
      ansilabnl.warmdesk.invoice_template:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Monthly Support"
        notes: "8 hours included — updated"
        state: present
      register: tmpl_update_idempotent

    - name: "[invoice_template] Assert no change on update idempotency"
      ansible.builtin.assert:
        that:
          - not tmpl_update_idempotent.changed
        fail_msg: "invoice_template update idempotency failed"

    - name: "[invoice_template] Remove template"
      ansilabnl.warmdesk.invoice_template:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Monthly Support"
        state: absent
      register: tmpl_absent

    - name: "[invoice_template] Assert removal reported changed"
      ansible.builtin.assert:
        that:
          - tmpl_absent.changed
        fail_msg: "invoice_template absent failed"

    - name: "[invoice_template] Remove absent template again (idempotency)"
      ansilabnl.warmdesk.invoice_template:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Monthly Support"
        state: absent
      register: tmpl_absent_idempotent

    - name: "[invoice_template] Assert no change when already absent"
      ansible.builtin.assert:
        that:
          - not tmpl_absent_idempotent.changed
        fail_msg: "invoice_template absent idempotency failed"

    # =========================================================================
    # user module
    # =========================================================================

    - name: "[user] Create user"
      ansilabnl.warmdesk.user:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        username: "mol-testuser"
        password: "TestUser1234!"
        email: "mol-testuser@example.com"
        display_name: "Molecule Test User"
        global_role: "user"
        state: present
      register: user_create

    - name: "[user] Assert user created"
      ansible.builtin.assert:
        that:
          - user_create.changed
          - user_create.user is not none
          - user_create.user.username == "mol-testuser"
        fail_msg: "user create failed: {{ user_create }}"

    - name: "[user] Update user display_name (email required but unchanged)"
      ansilabnl.warmdesk.user:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        username: "mol-testuser"
        email: "mol-testuser@example.com"
        display_name: "Molecule Test User Updated"
        state: present
      register: user_update

    - name: "[user] Assert update reported changed"
      ansible.builtin.assert:
        that:
          - user_update.changed
        fail_msg: "user update failed"

    - name: "[user] Update same display_name again (idempotency)"
      ansilabnl.warmdesk.user:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        username: "mol-testuser"
        email: "mol-testuser@example.com"
        display_name: "Molecule Test User Updated"
        state: present
      register: user_update_idempotent

    - name: "[user] Assert no change on update idempotency"
      ansible.builtin.assert:
        that:
          - not user_update_idempotent.changed
        fail_msg: "user update idempotency failed"

    - name: "[user] Remove user (soft-delete)"
      ansilabnl.warmdesk.user:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        username: "mol-testuser"
        state: absent
      register: user_absent

    - name: "[user] Assert removal reported changed"
      ansible.builtin.assert:
        that:
          - user_absent.changed
        fail_msg: "user absent failed"

    - name: "[user] Remove absent user again (idempotency)"
      ansilabnl.warmdesk.user:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        username: "mol-testuser"
        state: absent
      register: user_absent_idempotent

    - name: "[user] Assert no change when already absent"
      ansible.builtin.assert:
        that:
          - not user_absent_idempotent.changed
        fail_msg: "user absent idempotency failed"

    # =========================================================================
    # card module — move to another project (move_to_project)
    # The projects are not removed afterwards: project deletion is a soft
    # delete that keeps the slug and key prefix taken, so a converge re-run on
    # the same database could not recreate them. Everything below reads the
    # slugs, key prefixes and card numbers from registered results, so a
    # re-run simply moves a fresh card.
    # =========================================================================

    - name: "[card_move] Customer for the move projects"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Move Customer"
        state: present

    - name: "[card_move] Source and target projects"
      ansilabnl.warmdesk.project:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "{{ item }}"
        customer: "Molecule Move Customer"
        state: present
      loop:
        - "Molecule Move Source"
        - "Molecule Move Target"
      register: move_projects

    - name: "[card_move] Remember both projects"
      ansible.builtin.set_fact:
        move_src: "{{ move_projects.results[0].project }}"
        move_dst: "{{ move_projects.results[1].project }}"

    - name: "[card_move] Done column in both projects"
      ansilabnl.warmdesk.column:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        project: "{{ item }}"
        name: Done
        state: present
      loop:
        - "{{ move_src.slug }}"
        - "{{ move_dst.slug }}"
      register: move_done_cols

    - name: "[card_move] Label in the source project only"
      ansilabnl.warmdesk.label:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        project: "{{ move_src.slug }}"
        name: Infra
        color: "#00aa00"
        state: present
      register: move_label

    - name: "[card_move] Create the card to move"
      ansilabnl.warmdesk.card:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        project: "{{ move_src.slug }}"
        column: Backlog
        title: "Molecule move card {{ lookup('ansible.builtin.pipe', 'date +%s%N') }}"
        priority: high
      register: move_card

    - name: "[card_move] Add a label, a comment and a sub-card (no modules for these)"
      ansible.builtin.uri:
        url: "{{ warmdesk_url }}/api/v1/projects/{{ move_src.slug }}/cards/{{ move_card.card.id }}/{{ item.path }}"
        method: POST
        headers:
          X-API-Key: "{{ warmdesk_api_key }}"
        body_format: json
        body: "{{ item.body }}"
        status_code: [200, 201]
      loop:
        - {path: "labels/{{ move_label.label.id }}", body: {}}
        - {path: "comments", body: {body: "must survive the move"}}
        - {path: "subcards", body: {title: "Molecule move sub-card"}}
      register: move_extras

    - name: "[card_move] Put the sub-card in Done, to check lane mapping by name"
      ansible.builtin.uri:
        url: "{{ warmdesk_url }}/api/v1/projects/{{ move_src.slug }}/cards/{{ move_extras.results[2].json.id }}/move"
        method: PATCH
        headers:
          X-API-Key: "{{ warmdesk_api_key }}"
        body_format: json
        body:
          column_id: "{{ move_done_cols.results[0].column.id }}"
          position: 1000
        status_code: 200

    - name: "[card_move] Remember the old references"
      ansible.builtin.set_fact:
        move_old_ref: "{{ move_card.card.card_ref }}"
        move_old_sub_ref: "{{ move_src.key_prefix }}-{{ move_extras.results[2].json.card_number }}"

    - name: "[card_move] Move in check mode"
      ansilabnl.warmdesk.card:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        project: "{{ move_src.slug }}"
        title: irrelevant
        card_number: "{{ move_old_ref }}"
        move_to_project: "{{ move_dst.slug }}"
        move_to_column: Backlog
      check_mode: true
      register: move_check

    - name: "[card_move] Assert check mode reported a change but left the card in place"
      ansible.builtin.assert:
        that:
          - move_check.changed
          - lookup('ansilabnl.warmdesk.card', move_old_ref, project=move_src.slug,
                   url=warmdesk_url, api_key=warmdesk_api_key).id == move_card.card.id
        fail_msg: "check-mode move failed: {{ move_check }}"

    - name: "[card_move] Move the card to the target project"
      ansilabnl.warmdesk.card:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        project: "{{ move_src.slug }}"
        title: irrelevant
        card_number: "{{ move_old_ref }}"
        move_to_project: "{{ move_dst.slug }}"
        move_to_column: Backlog
      register: move_result

    - name: "[card_move] Assert the card moved and was renumbered"
      ansible.builtin.assert:
        that:
          - move_result.changed
          - move_result.card.id == move_card.card.id
          - move_result.card.project_id == move_dst.id
          - move_result.card.card_ref.startswith(move_dst.key_prefix ~ '-')
          - move_result.card.previous_key == move_old_ref
          - move_result.card.moved_sub_card_ids | length == 1
        fail_msg: "move failed: {{ move_result }}"

    - name: "[card_move] Move again (idempotency)"
      ansilabnl.warmdesk.card:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        project: "{{ move_src.slug }}"
        title: irrelevant
        card_number: "{{ move_old_ref }}"
        move_to_project: "{{ move_dst.slug }}"
        move_to_column: Backlog
      register: move_again

    - name: "[card_move] Assert no change when already moved"
      ansible.builtin.assert:
        that:
          - not move_again.changed
          - move_again.card.card_ref == move_result.card.card_ref
        fail_msg: "move idempotency failed: {{ move_again }}"

    - name: "[card_move] Fetch the moved card and its sub-card"
      ansible.builtin.uri:
        url: "{{ warmdesk_url }}/api/v1/{{ item }}"
        headers:
          X-API-Key: "{{ warmdesk_api_key }}"
        status_code: 200
      loop:
        - "projects/{{ move_dst.slug }}/cards/{{ move_card.card.id }}"
        - "projects/{{ move_dst.slug }}/cards/{{ move_extras.results[2].json.id }}"
        - "cards/resolve/{{ move_old_sub_ref }}"
      register: move_fetch

    - name: "[card_move] Assert comment, label and sub-card came along"
      ansible.builtin.assert:
        that:
          - move_fetch.results[0].json.comments | map(attribute='body') | list == ['must survive the move']
          - move_fetch.results[0].json.labels | map(attribute='name') | list == ['Infra']
          - move_fetch.results[0].json.labels[0].project_id == move_dst.id
          - move_fetch.results[1].json.parent_card_id == move_card.card.id
          - move_fetch.results[1].json.column_id == move_done_cols.results[1].column.id
          - move_fetch.results[2].json.project_slug == move_dst.slug
        fail_msg: "moved card lost data: {{ move_fetch.results | map(attribute='json') | list }}"

    - name: "[card_move] Look up the card by its old reference in the target project"
      ansible.builtin.set_fact:
        move_lookup_new: "{{ lookup('ansilabnl.warmdesk.card', move_old_ref, project=move_dst.slug,
                                    url=warmdesk_url, api_key=warmdesk_api_key) }}"

    - name: "[card_move] Look up the old reference in the source project"
      ansible.builtin.set_fact:
        move_lookup_old: "{{ lookup('ansilabnl.warmdesk.card', move_old_ref, project=move_src.slug,
                                    url=warmdesk_url, api_key=warmdesk_api_key) }}"
      ignore_errors: true
      register: move_lookup_old_result

    - name: "[card_move] Assert both lookups follow the move"
      ansible.builtin.assert:
        that:
          - move_lookup_new.id == move_card.card.id
          - move_lookup_old_result is failed
          - ("moved to project \"" ~ move_dst.slug ~ "\" as " ~ move_result.card.card_ref) in move_lookup_old_result.msg
        fail_msg: "lookup did not follow the move: {{ move_lookup_old_result.msg | default('') }}"

    # =========================================================================
    # check_mode smoke test
    # =========================================================================

    - name: "[check_mode] Create customer in check mode"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Check Mode Customer"
        state: present
      register: cm_create
      check_mode: true

    - name: "[check_mode] Assert check_mode reported would-change without creating"
      ansible.builtin.assert:
        that:
          - cm_create.changed
        fail_msg: "check_mode create did not report changed"

    - name: "[check_mode] Confirm resource was NOT actually created"
      ansilabnl.warmdesk.customer:
        warmdesk_url: "{{ warmdesk_url }}"
        warmdesk_api_key: "{{ warmdesk_api_key }}"
        name: "Molecule Check Mode Customer"
        state: absent
      register: cm_absent

    - name: "[check_mode] Assert resource was never persisted (absent reports no change)"
      ansible.builtin.assert:
        that:
          - not cm_absent.changed
        fail_msg: "check_mode did not prevent creation: absent reported changed"
